<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GymTracker — Силовые тренировки</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c121d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/static/icon-512.png">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            gym: {
              950: '#06090e',
              900: '#0c121d',
              850: '#111927',
              800: '#172234',
              700: '#23334d',
              accent: '#10b981', // Emerald
              accentHover: '#059669',
              neon: '#38bdf8', // Sky
              warn: '#f59e0b',
              danger: '#ef4444'
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <style>
    /* Safe Area Variables for iPhone Notch, Dynamic Island and Home Indicator */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    .safe-header {
      padding-top: max(0.5rem, calc(env(safe-area-inset-top, 0px) + 0.35rem));
    }
    .safe-top {
      padding-top: max(0.5rem, env(safe-area-inset-top, 0px));
    }
    .safe-bottom {
      padding-bottom: max(0.25rem, env(safe-area-inset-bottom, 0px));
    }
    .safe-pb-nav {
      padding-bottom: max(4.25rem, calc(env(safe-area-inset-bottom, 0px) + 4rem));
    }
    .pt-safe-top {
      padding-top: max(0.5rem, calc(env(safe-area-inset-top, 0px) + 0.35rem));
    }

    /* Mobile-first gym app polish */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: auto;
    }
    /* Hide scrollbar for smooth clean horizontal scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Prevent rubber banding on iOS */
    html, body {
      background-color: #06090e;
      color: #f8fafc;
      overscroll-behavior-y: none;
      min-height: 100vh;
    }
    /* Pulsing recording indicator */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .live-dot {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gym-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root">
    <div id="app-loading-placeholder" class="min-h-screen bg-gym-950 flex flex-col items-center justify-center p-6 text-center">
      <div class="w-14 h-14 rounded-2xl bg-gym-900 border border-gym-800 flex items-center justify-center shadow-xl animate-pulse mb-4">
        <span class="text-2xl">⚡</span>
      </div>
      <div class="text-sm font-black text-white tracking-wide">GymTracker</div>
      <div class="text-xs text-slate-500 mt-1 font-mono">Загрузка интерфейса...</div>
    </div>
  </div>

  <script>
    window.addEventListener('error', function(e) {
      var p = document.getElementById('app-loading-placeholder');
      if (p) {
        p.innerHTML = '<div class="space-y-3 p-6 text-center max-w-xs mx-auto"><div class="text-3xl">⚠️</div><div class="text-sm font-black text-rose-400">Ошибка запуска</div><div class="text-xs text-slate-400 leading-relaxed">' + (e.message || 'Скрипт не смог загрузиться') + '</div><button onclick="window.location.reload(true)" class="mt-4 px-4 py-2 bg-emerald-500 text-gym-950 font-black text-xs rounded-xl shadow-lg active:scale-95 transition">Обновить</button></div>';
      }
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('[PWA] Service Worker registered:', reg.scope);
        }).catch(err => {
          console.log('[PWA] Service Worker registration failed:', err);
        });
      });
    }
  </script>

  <!-- React App -->
  <script type="text/babel" src="/static/app.js?v=26"></script>
</body>
</html>
