<!DOCTYPE html>
<html lang="ru" class="theme-soft-neu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GymTracker — Силовые тренировки</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#dde2e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/static/icon-512.png">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Fonts: Plus Jakarta Sans, JetBrains Mono & Share Tech Mono (for retro digital LCD) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            digital: ['"Share Tech Mono"', '"JetBrains Mono"', 'monospace'],
          },
          colors: {
            gym: {
              950: '#06090e',
              900: '#0c121d',
              850: '#111927',
              800: '#172234',
              700: '#23334d',
              accent: '#10b981', // Emerald
              accentHover: '#059669',
              neon: '#38bdf8', // Sky
              warn: '#f59e0b',
              danger: '#ef4444'
            },
            neu: {
              bg: '#dde2e8',
              surface: '#dde2e8',
              inset: '#d6dce3',
              dark: '#1a1c1e',
              lcd: '#abb39e',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <style>
    /* Safe Area Variables for iPhone Notch, Dynamic Island and Home Indicator */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      
      /* Neumorphic Soft UI Tokens */
      --neu-base: #dde2e8;
      --neu-inset-bg: #d6dce3;
      --neu-dark-pill: #1a1c1e;
      --neu-lcd-bg: #abb39e;
      --neu-lcd-text: #1a2218;
      --neu-shadow-dark: #b6bfca;
      --neu-shadow-light: #ffffff;
    }

    .safe-header {
      padding-top: max(0.5rem, calc(env(safe-area-inset-top, 0px) + 0.35rem));
    }
    .safe-top {
      padding-top: max(0.5rem, env(safe-area-inset-top, 0px));
    }
    .safe-bottom {
      padding-bottom: max(0.25rem, env(safe-area-inset-bottom, 0px));
    }
    .safe-pb-nav {
      padding-bottom: max(5rem, calc(env(safe-area-inset-bottom, 0px) + 4.75rem));
    }
    .pt-safe-top {
      padding-top: max(0.5rem, calc(env(safe-area-inset-top, 0px) + 0.35rem));
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: auto;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ==================================================== */
    /* 🎨 DUAL-THEME NEUMORPHIC SOFT UI SYSTEM (Clay Design) */
    /* ==================================================== */

    /* ☀️ LIGHT NEUMORPHIC PALETTE */
    :root,
    html.theme-neu-light,
    body.theme-neu-light,
    body.theme-soft-neu {
      --neu-base: #dde2e8;
      --neu-surface: #dde2e8;
      --neu-surface-card: #e5ebf2;
      --neu-inset-bg: #d2d8e2;
      --neu-shadow-dark: #b4beca;
      --neu-shadow-light: #ffffff;
      --neu-border: rgba(255, 255, 255, 0.75);
      --neu-border-subtle: rgba(180, 190, 202, 0.45);
      --neu-text-primary: #1a202c;
      --neu-text-secondary: #475569;
      --neu-text-muted: #64748b;
      --neu-lcd-bg: #abb39e;
      --neu-lcd-text: #1e2417;
      --neu-dark-pill: #1f2329;
      --neu-dock-bg: #dde2e8;
    }

    /* 🌙 DARK NEUMORPHIC PALETTE (Same design, rich tactile dark styling) */
    html.theme-neu-dark,
    body.theme-neu-dark,
    html.dark body.theme-neu-dark {
      --neu-base: #14171c;
      --neu-surface: #1a1e24;
      --neu-surface-card: #20242c;
      --neu-inset-bg: #101216;
      --neu-shadow-dark: #090a0d;
      --neu-shadow-light: #242932;
      --neu-border: rgba(255, 255, 255, 0.08);
      --neu-border-subtle: rgba(255, 255, 255, 0.04);
      --neu-text-primary: #f8fafc;
      --neu-text-secondary: #cbd5e1;
      --neu-text-muted: #94a3b8;
      --neu-lcd-bg: #1c2720;
      --neu-lcd-text: #4ade80;
      --neu-dark-pill: #0e1013;
      --neu-dock-bg: #1a1e24;
    }

    /* Base Body & App Container */
    body.theme-neu-light,
    body.theme-neu-dark,
    body.theme-soft-neu {
      background-color: var(--neu-base) !important;
      color: var(--neu-text-primary) !important;
    }
    body.theme-neu-light #root > div,
    body.theme-neu-dark #root > div,
    body.theme-soft-neu #root > div {
      background-color: var(--neu-base) !important;
      color: var(--neu-text-primary) !important;
    }

    /* Header */
    body.theme-neu-light header,
    body.theme-neu-dark header,
    body.theme-soft-neu header {
      background-color: var(--neu-surface) !important;
      border-bottom: 1px solid var(--neu-border) !important;
      box-shadow: 0 4px 12px var(--neu-shadow-dark) !important;
    }

    /* Core Neumorphic Primitives */
    .neu-flat {
      background-color: var(--neu-surface) !important;
      box-shadow: 6px 6px 14px var(--neu-shadow-dark), -6px -6px 14px var(--neu-shadow-light) !important;
      border: 1px solid var(--neu-border) !important;
    }
    .neu-flat-sm {
      background-color: var(--neu-surface) !important;
      box-shadow: 3px 3px 8px var(--neu-shadow-dark), -3px -3px 8px var(--neu-shadow-light) !important;
      border: 1px solid var(--neu-border) !important;
    }
    .neu-inset {
      background-color: var(--neu-inset-bg) !important;
      box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light) !important;
      border: 1px solid var(--neu-border-subtle) !important;
    }
    .neu-btn {
      background-color: var(--neu-surface) !important;
      box-shadow: 4px 4px 10px var(--neu-shadow-dark), -4px -4px 10px var(--neu-shadow-light) !important;
      border: 1px solid var(--neu-border) !important;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .neu-btn:active {
      box-shadow: inset 2px 2px 5px var(--neu-shadow-dark), inset -2px -2px 5px var(--neu-shadow-light) !important;
      transform: scale(0.97);
    }
    .neu-dark-pill {
      background-color: var(--neu-dark-pill) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 4px 4px 10px var(--neu-shadow-dark), -2px -2px 6px var(--neu-shadow-light) !important;
      color: #ffffff !important;
    }
    .neu-lcd {
      background-color: var(--neu-lcd-bg) !important;
      color: var(--neu-lcd-text) !important;
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.35), inset -3px -3px 6px rgba(255, 255, 255, 0.1) !important;
      font-family: 'Share Tech Mono', 'JetBrains Mono', monospace !important;
      border: 1px solid rgba(0, 0, 0, 0.15) !important;
    }
    .neu-dial {
      background-color: #14161a !important;
      color: #ffffff !important;
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.7), inset -2px -2px 5px rgba(255,255,255,0.12) !important;
    }
    .neu-toggle {
      background-color: var(--neu-inset-bg) !important;
      box-shadow: inset 2px 2px 5px var(--neu-shadow-dark), inset -2px -2px 5px var(--neu-shadow-light) !important;
      border: 1px solid var(--neu-border-subtle) !important;
    }
    .neu-dock {
      background-color: var(--neu-dock-bg) !important;
      box-shadow: 0 10px 25px var(--neu-shadow-dark), 0 -2px 10px var(--neu-shadow-light) !important;
      border: 1px solid var(--neu-border) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
    }

    /* 🏗️ Automated Card & Input Styling across entire app */
    /* Outer elevated cards */
    [class*="bg-gym-900"]:not(.neu-dock):not(.neu-dark-pill):not(.neu-btn),
    [class*="bg-gym-850"]:not(.neu-dock):not(.neu-dark-pill):not(.neu-btn) {
      background-color: var(--neu-surface) !important;
      border-color: var(--neu-border) !important;
      box-shadow: 6px 6px 14px var(--neu-shadow-dark), -6px -6px 14px var(--neu-shadow-light) !important;
    }

    /* Inner sub-containers (formerly dark slabs) -> Now smooth recessed clay pockets */
    [class*="bg-gym-950"]:not(.neu-dark-pill):not(.neu-dock):not(input):not(button) {
      background-color: var(--neu-inset-bg) !important;
      border-color: var(--neu-border-subtle) !important;
      box-shadow: inset 2px 2px 5px var(--neu-shadow-dark), inset -2px -2px 5px var(--neu-shadow-light) !important;
    }

    /* Tactile buttons inside containers */
    button[class*="bg-gym-800"]:not(.neu-btn):not([class*="bg-sky-500"]):not([class*="bg-emerald-500"]):not([class*="bg-rose-500"]):not([class*="bg-amber-500"]),
    button[class*="bg-gym-950"]:not(.neu-btn):not([class*="bg-sky-500"]):not([class*="bg-emerald-500"]):not([class*="bg-rose-500"]):not([class*="bg-amber-500"]) {
      background-color: var(--neu-surface) !important;
      box-shadow: 3px 3px 8px var(--neu-shadow-dark), -3px -3px 8px var(--neu-shadow-light) !important;
      border: 1px solid var(--neu-border) !important;
      color: var(--neu-text-secondary) !important;
    }

    /* Inputs: transparent inside inset boxes */
    input.bg-transparent {
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
      color: var(--neu-text-primary) !important;
    }
    input:not(.bg-transparent),
    textarea,
    select {
      background-color: var(--neu-inset-bg) !important;
      color: var(--neu-text-primary) !important;
      border: 1px solid var(--neu-border-subtle) !important;
      box-shadow: inset 2px 2px 5px var(--neu-shadow-dark), inset -2px -2px 5px var(--neu-shadow-light) !important;
    }

    /* High contrast text on dark pills, dials, and colored badges */
    .neu-dark-pill,
    .neu-dark-pill *,
    [class*="bg-sky-500"] *,
    [class*="bg-emerald-500"] *,
    [class*="bg-rose-500"] *,
    [class*="bg-amber-500"] *,
    [class*="bg-purple-500"] *,
    .neu-dial,
    .neu-dial * {
      color: #ffffff !important;
    }
    .neu-dark-pill .text-slate-400,
    .neu-dark-pill .text-slate-500,
    .neu-dark-pill p,
    .neu-dark-pill span.font-mono {
      color: #cbd5e1 !important;
    }

    /* Light Theme Typography Overrides */
    body.theme-neu-light h1:not(.neu-dark-pill *):not([class*="bg-sky-500"] *):not([class*="bg-emerald-500"] *),
    body.theme-neu-light h2:not(.neu-dark-pill *):not([class*="bg-sky-500"] *):not([class*="bg-emerald-500"] *),
    body.theme-neu-light h3:not(.neu-dark-pill *):not([class*="bg-sky-500"] *):not([class*="bg-emerald-500"] *),
    body.theme-soft-neu h1:not(.neu-dark-pill *):not([class*="bg-sky-500"] *):not([class*="bg-emerald-500"] *),
    body.theme-soft-neu h2:not(.neu-dark-pill *):not([class*="bg-sky-500"] *):not([class*="bg-emerald-500"] *),
    body.theme-soft-neu h3:not(.neu-dark-pill *):not([class*="bg-sky-500"] *):not([class*="bg-emerald-500"] *) {
      color: #1a202c !important;
    }
    body.theme-neu-light .text-slate-100:not(.neu-dark-pill *),
    body.theme-neu-light .text-slate-200:not(.neu-dark-pill *),
    body.theme-soft-neu .text-slate-100:not(.neu-dark-pill *),
    body.theme-soft-neu .text-slate-200:not(.neu-dark-pill *) {
      color: #1a202c !important;
    }
    body.theme-neu-light .text-slate-400:not(.neu-dark-pill *),
    body.theme-neu-light .text-slate-500:not(.neu-dark-pill *),
    body.theme-soft-neu .text-slate-400:not(.neu-dark-pill *),
    body.theme-soft-neu .text-slate-500:not(.neu-dark-pill *) {
      color: #64748b !important;
    }

    /* Dark Theme Typography Overrides */
    body.theme-neu-dark h1,
    body.theme-neu-dark h2,
    body.theme-neu-dark h3,
    body.theme-neu-dark .text-white,
    body.theme-neu-dark .text-slate-100,
    body.theme-neu-dark .text-slate-200,
    body.theme-neu-dark .text-slate-300 {
      color: #f8fafc !important;
    }
    body.theme-neu-dark .text-slate-400,
    body.theme-neu-dark .text-slate-500 {
      color: #94a3b8 !important;
    }

    /* Borders */
    [class*="border-gym-800"],
    [class*="border-gym-700"] {
      border-color: var(--neu-border-subtle) !important;
    }

    /* Modals backdrop */
    .fixed.inset-0.bg-black\/85,
    .fixed.inset-0.bg-black\/80 {
      background-color: rgba(15, 23, 42, 0.55) !important;
      backdrop-filter: blur(8px) !important;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .live-dot {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="theme-soft-neu text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root">
    <div id="app-loading-placeholder" class="min-h-screen bg-gym-950 flex flex-col items-center justify-center p-6 text-center">
      <div class="w-14 h-14 rounded-2xl bg-gym-900 border border-gym-800 flex items-center justify-center shadow-xl animate-pulse mb-4">
        <span class="text-2xl">⚡</span>
      </div>
      <div class="text-sm font-black text-white tracking-wide">GymTracker</div>
      <div class="text-xs text-slate-500 mt-1 font-mono">Загрузка интерфейса...</div>
    </div>
  </div>

  <script>
    window.addEventListener('error', function(e) {
      var p = document.getElementById('app-loading-placeholder');
      if (p) {
        var msg = (e.message || 'Скрипт не смог загрузиться') + (e.lineno ? ' (строка ' + e.lineno + ')' : '');
        p.innerHTML = '<div class="space-y-3 p-6 text-center max-w-xs mx-auto"><div class="text-3xl">⚠️</div><div class="text-sm font-black text-rose-400">Ошибка запуска</div><div class="text-xs text-slate-400 leading-relaxed font-mono text-[11px]">' + msg + '</div><button onclick="window.location.reload(true)" class="mt-4 px-4 py-2 bg-emerald-500 text-gym-950 font-black text-xs rounded-xl shadow-lg active:scale-95 transition">Обновить</button></div>';
      }
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('[PWA] Service Worker registered:', reg.scope);
        }).catch(err => {
          console.log('[PWA] Service Worker registration failed:', err);
        });
      });
    }
  </script>

  <!-- React App -->
  <script type="text/babel" src="/static/app.js?v=33"></script>
</body>
</html>
