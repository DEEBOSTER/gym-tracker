    /* Safe Area Variables for iPhone Notch, Dynamic Island and Home Indicator */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      
      /* Neumorphic Soft UI Tokens */
      --neu-base: #dde2e8;
      --neu-inset-bg: #d6dce3;
      --neu-dark-pill: #1a1c1e;
      --neu-lcd-bg: #abb39e;
      --neu-lcd-text: #1a2218;
      --neu-shadow-dark: #b6bfca;
      --neu-shadow-light: #ffffff;
    }

    .safe-header {
      padding-top: max(0.5rem, calc(env(safe-area-inset-top, 0px) + 0.35rem));
    }
    .safe-top {
      padding-top: max(0.5rem, env(safe-area-inset-top, 0px));
    }
    .safe-bottom {
      padding-bottom: max(0.25rem, env(safe-area-inset-bottom, 0px));
    }
    .safe-pb-nav {
      padding-bottom: max(5rem, calc(env(safe-area-inset-bottom, 0px) + 4.75rem));
    }
    .pt-safe-top {
      padding-top: max(0.5rem, calc(env(safe-area-inset-top, 0px) + 0.35rem));
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    html {
      background-color: #18191d !important;
      color-scheme: dark;
    }
    body {
      background-color: #0f1013 !important;
      color-scheme: dark;
    }
    html, body {
      overflow-x: hidden !important;
      max-width: 100vw !important;
      width: 100% !important;
      position: relative;
      touch-action: pan-y pinch-zoom;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: none;
    }
    #root {
      overflow-x: hidden !important;
      max-width: 100% !important;
      width: 100% !important;
    }
    input, textarea {
      user-select: auto;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ⚡ MODERN ATHLETIC DESIGN SYSTEM (Fitbod / NTC / Strava) */
    /* ==================================================== */

    /* 🌙 STRAVA ATHLETIC DARK PALETTE */

    html.theme-neu-dark,
    body.dark,
    body.theme-neu-dark,
    body {

      --neu-dark-pill: #15161a;

    /* ☀️ STRAVA ATHLETIC LIGHT PALETTE */

      --neu-border-subtle: rgba(226, 232, 240, 0.6);
      --neu-text-primary: #121214;
      --neu-text-secondary: #3f3f46;

      --strava-orange: #fc4c02;
      --strava-orange-hover: #e04302;
      --strava-orange-glow: rgba(252, 76, 2, 0.25);

      --neu-accent-cyan: #0284c7;
      --neu-accent-amber: #d97706;
      --neu-lcd-bg: #e2e8f0;

      --neu-dock-bg: rgba(255, 255, 255, 0.92);
    }

    /* Base Body & App Container */
    body {
      background-color: var(--neu-base) !important;
      color: var(--neu-text-primary) !important;
    }
    #root > div {
      background-color: var(--neu-base) !important;
      color: var(--neu-text-primary) !important;
    }

    /* Header */
    header {

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Core Athletic Primitives */
    .neu-flat {
      background-color: var(--neu-surface) !important;
      border: 1px solid var(--neu-border) !important;
      box-shadow: 0 4px 20px -2px var(--neu-shadow-dark) !important;
    }
    .neu-flat-sm {

    }
    .neu-inset {

    }
    .neu-btn {

      box-shadow: 0 2px 6px -1px var(--neu-shadow-dark) !important;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);

    }
    .neu-dark-pill {

      border: 1px solid var(--neu-border) !important;
    }
    .neu-dial {
      background-color: var(--neu-inset-bg) !important;

    .neu-toggle {

    .neu-dock {

      border: 1px solid var(--neu-border) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
    }

    /* 🏗️ Automated Card & Input Styling across entire app */
    /* Outer elevated cards */
    [class*="bg-gym-900"]:not(.neu-dock):not(.neu-dark-pill):not(.neu-btn),

    /* Inner sub-containers (smooth athletic pockets) */
    [class*="bg-gym-950"]:not(.neu-dark-pill):not(.neu-dock):not(input):not(button) {
      background-color: var(--neu-inset-bg) !important;

    /* Tactile buttons inside containers */
    button[class*="bg-gym-800"]:not(.neu-btn):not([class*="bg-sky-500"]):not([class*="bg-emerald-500"]):not([class*="bg-rose-500"]):not([class*="bg-amber-500"]),

    /* Inputs: transparent inside inset boxes */
    input.bg-transparent {

    .bg-neu-base {

    }

    }
    body.theme-neu-dark .text-slate-400,
    body.theme-neu-dark .text-slate-500 {
      color: #94a3b8 !important;
    }

    /* Borders */
    [class*="border-gym-800"],
    [class*="border-gym-700"] {
      border-color: var(--neu-border-subtle) !important;
    }

    /* Modals backdrop */
    .fixed.inset-0.bg-black\/85,
    .fixed.inset-0.bg-black\/80 {
      background-color: rgba(15, 23, 42, 0.55) !important;
      backdrop-filter: blur(8px) !important;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .live-dot {
      animation: pulse-ring 2s infinite ease-in-out;
    }

    /* Water Liquid Wave Animation */
    @keyframes liquidWaveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25%); }
      100% { transform: translateX(0); }
    }
    .animate-liquid-wave {
      animation: liquidWaveMove 3.5s ease-in-out infinite;
    }

    /* Rising Water Bubbles */
    @keyframes bubbleRiseUp {
      0% { transform: translateY(120%) scale(0.6); opacity: 0; }
      40% { opacity: 0.75; }
      100% { transform: translateY(-30%) scale(1.1); opacity: 0; }
    }
    .bubble-float-1 {
      animation: bubbleRiseUp 2.8s ease-in infinite;
    }
    .bubble-float-2 {
      animation: bubbleRiseUp 3.9s ease-in infinite 1.1s;
    }
    .bubble-float-3 {
      animation: bubbleRiseUp 3.3s ease-in infinite 2.2s;
    }

    /* AI Photo Food Scanner Laser Line */
    @keyframes scanLaserSweep {
      0% { top: 0%; opacity: 0.8; }
      50% { top: 92%; opacity: 1; }
      100% { top: 0%; opacity: 0.8; }
    }
    .animate-scan-laser {
      animation: scanLaserSweep 2.2s ease-in-out infinite;
    }
  </style>
</head>
<body class="dark theme-neu-dark bg-[#0f1013] text-white antialiased selection:bg-emerald-500 selection:text-white" style="background-color: #0f1013; color-scheme: dark;">
  <div id="root">
    <div id="app-loading-placeholder" class="min-h-screen bg-gym-950 flex flex-col items-center justify-center p-6 text-center">
      <div class="w-14 h-14 rounded-2xl bg-gym-900 border border-gym-800 flex items-center justify-center shadow-xl animate-pulse mb-4">
        <span class="text-2xl">⚡</span>
      </div>
      <div class="text-sm font-black text-white tracking-wide">GymTracker</div>
      <div class="text-xs text-slate-500 mt-1 font-mono">Загрузка интерфейса...</div>
    </div>
  </div>

  <script>
    window.addEventListener('error', function(e) {
      var p = document.getElementById('app-loading-placeholder');
      if (p) {
        var msg = (e.message || 'Скрипт не смог загрузиться') + (e.lineno ? ' (строка ' + e.lineno + ')' : '');
        p.innerHTML = '<div class="space-y-3 p-6 text-center max-w-xs mx-auto"><div class="text-3xl">⚠️</div><div class="text-sm font-black text-rose-400">Ошибка запуска</div><div class="text-xs text-slate-400 leading-relaxed font-mono text-[11px]">' + msg + '</div><button onclick="window.location.reload(true)" class="mt-4 px-4 py-2 bg-emerald-500 text-gym-950 font-black text-xs rounded-xl shadow-lg active:scale-95 transition">Обновить</button></div>';
      }
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('[PWA] Service Worker registered:', reg.scope);
        }).catch(err => {
          console.log('[PWA] Service Worker registration failed:', err);
        });
      });
    }
  </script>

  <!-- React App -->
  <script type="text/babel" src="/static/app.js?v=55"></script>
</body>
</html>
