<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="12" />
  
  <!-- Dumbbell / Weight Icon -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Bar -->
    <rect x="136" y="240" width="240" height="32" rx="16" fill="#f8fafc" />
    <!-- Weight plates left -->
    <rect x="180" y="176" width="28" height="160" rx="12" fill="url(#primaryGrad)" />
    <rect x="144" y="200" width="24" height="112" rx="8" fill="url(#primaryGrad)" opacity="0.8" />
    <rect x="120" y="220" width="16" height="72" rx="6" fill="#94a3b8" />
    <!-- Weight plates right -->
    <rect x="304" y="176" width="28" height="160" rx="12" fill="url(#primaryGrad)" />
    <rect x="344" y="200" width="24" height="112" rx="8" fill="url(#primaryGrad)" opacity="0.8" />
    <rect x="376" y="220" width="16" height="72" rx="6" fill="#94a3b8" />
  </g>
</svg>
